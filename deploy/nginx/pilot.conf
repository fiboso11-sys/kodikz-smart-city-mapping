# Pilot Nginx — HTTPS termination + SSE + API + Socket.IO upgrade
# Place TLS certs in deploy/certs/ (fullchain.pem, privkey.pem)

upstream kodikz_app {
  server app:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  client_max_body_size 12m;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

  # Request ID
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Host $host;

  location /health {
    proxy_pass http://kodikz_app/api/health;
  }

  location /readiness {
    proxy_pass http://kodikz_app/api/readiness;
  }

  location /api/survey-events {
    proxy_pass http://kodikz_app/api/survey-events;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
  }

  location /api/attachments {
    proxy_pass http://kodikz_app/api/attachments;
    proxy_request_buffering off;
  }

  location /api/ {
    proxy_pass http://kodikz_app/api/;
  }

  # Existing GPS Socket.IO — proxy only if routed through this host
  location /socket.io/ {
    proxy_pass http://gps_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://kodikz_app/;
  }
}

# Replace with actual GPS backend host for pilot if proxied
upstream gps_upstream {
  server host.docker.internal:4000;
}
