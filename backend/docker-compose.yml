# kodikz-gps-backend — production stack
# Deploy: cp .env.example .env && docker compose up -d

services:
  mongo:
    image: mongo:7
    container_name: kodikz-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: kodikz
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kodikz-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kodikz-gps-backend
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${TCP_PORT:-5000}:5000"
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      API_HOST: 0.0.0.0
      PORT: 3000
      TCP_PORT: 5000
      MONGO_URI: mongodb://mongo:27017/kodikz
      DOMAIN: ${DOMAIN:-api-kodikz.giantphoenixllc.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api-kodikz.giantphoenixllc.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: "true"
      SIMULATION_MODE: ${SIMULATION_MODE:-false}
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - kodikz-net

volumes:
  mongo_data:

networks:
  kodikz-net:
    driver: bridge
