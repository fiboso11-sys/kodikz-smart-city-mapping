# Nginx example — api-kodikz.giantphoenixllc.com → Docker backend :3000
# Teltonika TCP :5000 is NOT proxied; open on VPS firewall for devices.

upstream kodikz_gps_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-kodikz.giantphoenixllc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-kodikz.giantphoenixllc.com;

    # ssl_certificate /etc/letsencrypt/live/api-kodikz.giantphoenixllc.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api-kodikz.giantphoenixllc.com/privkey.pem;

    location = /health {
        proxy_pass http://kodikz_gps_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://kodikz_gps_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
