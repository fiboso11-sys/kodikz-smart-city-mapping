# Plug-and-play Nginx — HTTPS termination + Survey UI/API + SSE
# TLS files: data/certs/fullchain.pem + privkey.pem (mounted to /etc/nginx/certs)
#
# GPS Socket.IO is NOT proxied here by default — browsers use NEXT_PUBLIC_SOCKET_URL
# directly to the external GPS backend. Add a /socket.io/ location only if Dubai
# intentionally terminates GPS WebSockets on this host.

upstream kodikz_app {
  server app:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  client_max_body_size 12m;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Host $host;

  location /health {
    proxy_pass http://kodikz_app/api/health;
  }

  location /readiness {
    proxy_pass http://kodikz_app/api/readiness;
  }

  location /api/survey-events {
    proxy_pass http://kodikz_app/api/survey-events;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
  }

  location /api/attachments {
    proxy_pass http://kodikz_app/api/attachments;
    proxy_request_buffering off;
  }

  location /api/ {
    proxy_pass http://kodikz_app/api/;
  }

  location / {
    proxy_pass http://kodikz_app/;
  }
}
