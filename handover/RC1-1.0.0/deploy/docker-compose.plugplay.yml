# Plug-and-play Compose for RC1 1.0.0 — immutable image tags (no :latest for app/worker)
# Secrets and customer values come from config/.env.production (env_file).
# MongoDB is NOT part of this stack (GPS backend remains external).

name: kodikz-rc1

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../deploy/nginx/plugplay.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-../data/certs}:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kodikz_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${POSTGRES_DATA_DIR:-../data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - kodikz_net
    # Intentionally no host port publish

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ${MINIO_DATA_DIR:-../data/minio}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - kodikz_net

  # Serves Next.js UI + Survey API (single process). Tagged also as frontend alias at build time.
  app:
    image: ${APP_IMAGE:-kodikz-smart-city-app:1.0.0-rc1}
    env_file:
      - ../config/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    networks:
      - kodikz_net
    # No public 3000 — only via nginx

  worker:
    image: ${WORKER_IMAGE:-kodikz-smart-city-worker:1.0.0-rc1}
    env_file:
      - ../config/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kodikz_net

networks:
  kodikz_net:
    name: kodikz_rc1_net
    driver: bridge
