services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kodikz
      POSTGRES_PASSWORD: kodikz_local
      POSTGRES_DB: giscd
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodikz -d giscd"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_local:/data

  app:
    build:
      context: .
      target: runner
    environment:
      DEPLOYMENT_MODE: local
      DATABASE_URL: postgresql://kodikz:kodikz_local@postgres:5432/giscd
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: kodikz-survey
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      AUTH_PROVIDER: local
      AUTH_JWT_SECRET: local-dev-only-secret-change-me-32chars
      MOCK_AUTH_ENABLED: "true"
      NEXT_PUBLIC_API_URL: https://api-kodikz.giantphoenixllc.com
      NEXT_PUBLIC_SOCKET_URL: https://api-kodikz.giantphoenixllc.com
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_local:
  minio_local:
